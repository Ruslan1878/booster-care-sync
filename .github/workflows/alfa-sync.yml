name: Booster Care - Alfa CRM sync
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '17 3 1 * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: booster-care-alfa-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.event.schedule != '17 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Refresh student directory
        env:
          CARE_SITE_URL: ${{ vars.CARE_SITE_URL }}
          CARE_SYNC_SECRET: ${{ secrets.CARE_SYNC_SECRET }}
          CARE_SITES_BYPASS_TOKEN: ${{ secrets.CARE_SITES_BYPASS_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const {CARE_SITE_URL,CARE_SYNC_SECRET,CARE_SITES_BYPASS_TOKEN}=process.env;
          if(!CARE_SITE_URL||!CARE_SYNC_SECRET||!CARE_SITES_BYPASS_TOKEN){console.log('Scheduler setup is pending. No request sent.');process.exit(0);}
          const base=new URL(CARE_SITE_URL);
          if(base.protocol!=='https:'||!base.hostname.endsWith('.chatgpt.site')||base.username||base.password||base.port)throw new Error('Invalid Site URL');
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          let busy=0;
          for(let page=0;page<600;page++){
            const response=await fetch(new URL('/api/alfa-sync',base),{method:'POST',redirect:'error',headers:{'Content-Type':'application/json','Authorization':'Bearer '+CARE_SYNC_SECRET,'OAI-Sites-Authorization':'Bearer '+CARE_SITES_BYPASS_TOKEN},body:'{}',signal:AbortSignal.timeout(65000)});
            if(response.status===429&&busy++<10){await pause(6000);page--;continue;}
            if(!response.ok)throw new Error('Student synchronization failed: HTTP '+response.status+'. Check Integrations in Booster Care.');
            const result=await response.json();
            if(result.done){console.log(result.skipped==='not_configured'?'Alfa CRM connection is not configured yet.':'Student directory is current.');process.exit(0);}
            await pause(400);
          }
          console.log('Progress checkpoint saved. The next scheduled run will continue.');
          NODE
  maintenance:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Record monthly scheduler maintenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const repository=process.env.GITHUB_REPOSITORY;
          if(!/^[\w.-]+\/[\w.-]+$/.test(repository))throw new Error('Invalid repository');
          const url='https://api.github.com/repos/'+repository+'/contents/heartbeat.json';
          const headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+process.env.GH_TOKEN,'X-GitHub-Api-Version':'2026-03-10'};
          const previous=await fetch(url,{headers,signal:AbortSignal.timeout(20000)});
          if(!previous.ok&&previous.status!==404)throw new Error('Cannot read maintenance record: HTTP '+previous.status);
          const file=previous.ok?await previous.json():null;
          const month=new Date().toISOString().slice(0,7);
          if(file){
            const prior=JSON.parse(Buffer.from(file.content,'base64').toString('utf8'));
            if(prior.month===month){console.log('Monthly maintenance already recorded.');process.exit(0);}
          }
          const content=Buffer.from(JSON.stringify({month,checkedAt:new Date().toISOString()},null,2)+'\n').toString('base64');
          const result=await fetch(url,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Record monthly scheduler maintenance',content,...(file?{sha:file.sha}:{})}),signal:AbortSignal.timeout(20000)});
          if(!result.ok)throw new Error('Cannot save maintenance record: HTTP '+result.status);
          console.log('Monthly scheduler maintenance recorded. No student data stored.');
          NODE
